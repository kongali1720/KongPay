services:

  postgres:
    image: postgres:17

    container_name: kongpay-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: kongpay
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kongpay"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine

    container_name: kongpay-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

volumes:
  postgres_data:
