version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kongpay-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-kongpay}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kongpay-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kongpay:
    build: .
    container_name: kongpay-api
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_NAME: ${DB_NAME:-kongpay}
      DB_SSL_MODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 8080
      BANK_API_KEY: ${BANK_API_KEY:-dummy}
      BANK_BASE_URL: ${BANK_BASE_URL:-https://bank-api.com}
      QRIS_MERCHANT_ID: ${QRIS_MERCHANT_ID:-dummy}
      QRIS_API_KEY: ${QRIS_API_KEY:-dummy}
      QRIS_BASE_URL: ${QRIS_BASE_URL:-https://qris-api.com}
      CRYPTO_NETWORK: ${CRYPTO_NETWORK:-ethereum}
      CRYPTO_RPC_URL: ${CRYPTO_RPC_URL:-https://rpc.ethereum.org}
      JWT_SECRET: ${JWT_SECRET:-supersecretkey}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: kongpay-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - kongpay
    restart: unless-stopped

volumes:
  postgres_data:
