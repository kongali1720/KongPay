name: Go CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Go Version
        run: go version

      - name: Download Dependencies
        run: go mod tidy

      - name: Build KongPay
        run: go build -v ./...

      - name: Run Tests
        run: go test -v ./...
